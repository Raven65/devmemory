name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
          - target: darwin-amd64
            os: macos-13
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxxf86vm-dev libgl1-mesa-dev libpng-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          LDFLAGS="-s -w"
          if [ "$GOOS" = "windows" ]; then LDFLAGS="$LDFLAGS -H windowsgui"; fi
          go build -trimpath -ldflags "$LDFLAGS" -o dist/devmemory-${{ matrix.target }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/devmemory

      - name: Run tests
        if: matrix.goos == 'linux'
        run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: devmemory-${{ matrix.target }}
          path: dist/devmemory-${{ matrix.target }}*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/devmemory-*/*
          generate_release_notes: true
